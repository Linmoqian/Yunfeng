[package]
name = "yunfeng-team"
version = "0.1.0"
edition = "2021"
description = "Yunfeng 独立团队核心与本机对等节点服务"

[features]
default = []
node = ["dep:base64", "dep:sha2", "dep:httparse", "dep:socket2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
url = { version = "2", default-features = false }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
httparse = { version = "1.10", optional = true }
socket2 = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "yunfeng-team-node"
path = "src/main.rs"
required-features = ["node"]
