[package]
name = "yunfeng-desktop"
version = "0.1.0"
description = "Yunfeng 桌面端外壳：窗口 + 托盘 + 自动拉起 yunfeng-server"
authors = ["Yunfeng"]
edition = "2021"

[lib]
name = "yunfeng_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
