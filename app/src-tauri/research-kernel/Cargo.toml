[package]
name = "yunfeng-research-kernel"
version = "0.1.0"
edition = "2021"
description = "科研本地操作核心与隔离性能对照入口"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
