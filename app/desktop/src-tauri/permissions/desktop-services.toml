[[permission]]
identifier = "desktop-services"
description = "保留主窗口已有服务编排命令"
commands.allow = [
  "start_server", "stop_server", "server_status",
  "start_gateway", "stop_gateway", "gateway_status",
  "start_mobile_backend", "stop_mobile_backend", "mobile_backend_status",
  "start_all", "stop_all", "orchestration_status",
  "rustdesk_open", "rustdesk_close", "rustdesk_status"
]
